// Virtual phone clock: each new page load starts at 2026-10-24 11:58 KST.
const simStartMs=Date.now();
const simBaseMs=Date.UTC(2026,9,24,11,58,0);
function simNow(){return new Date(simBaseMs+(Date.now()-simStartMs))}
function simParts(){const d=simNow();return {h:d.getUTCHours(),m:d.getUTCMinutes(),day:d.getUTCDate(),month:d.getUTCMonth()+1,weekday:d.getUTCDay()}}
function simTime(){const p=simParts();return String(p.h).padStart(2,'0')+':'+String(p.m).padStart(2,'0')}
function simDateLabel(){const p=simParts();return p.month+'월 '+p.day+'일 '+['일','월','화','수','목','금','토'][p.weekday]+'요일'}
function simWorldTime(){const p=simParts();return (p.h<12?'오전':'오후')+' '+String((p.h%12)||12).padStart(2,'0')+':'+String(p.m).padStart(2,'0')}

 const layer=document.getElementById('kyu-notice-layer');
 if(!layer)return;
 // Keep the notification below the status bar, matching the shared compact style.
 layer.innerHTML='<button class="calendar-live-banner" onclick="openDateAlert()" aria-label="캘린더 일정 뀨랑 데이트, 오후 12시"><span class="calendar-live-icon" id="calendar-alert-app-icon"></span><span class="calendar-live-copy"><strong>캘린더</strong><span>뀨랑 데이트 ❤️ · 오후 12:00</span></span></button>';

 try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){const ctx=new Ctx();if(ctx.state==='running'){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=880;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.065,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.32);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.33);osc.onended=()=>ctx.close() }else ctx.close()}
 }catch(e){}
}

 if(dateAlertShown||simNow().getTime()<dateAlertAt)return;
 dateAlertShown=true;

// Standalone folded-cover / unfolded-inner-screen mockup. Preserve all app state.
const FOLD8_CLOSED={w:360,h:740},FOLD8_OPEN={w:760,h:650};
let fold8Unlocked=false;
function fold8Fit(){
 const stage=document.getElementById('fold-stage');if(!stage)return;
 const d=fold8Unlocked?FOLD8_OPEN:FOLD8_CLOSED;
 const margin=window.innerWidth<650?14:32;
 const scale=Math.min(1,(window.innerWidth-margin*2)/d.w,(window.innerHeight-margin*2)/d.h);
 stage.style.width=d.w+'px';stage.style.height=d.h+'px';
 stage.style.transform='scale('+Math.max(.15,scale)+')';
 stage.style.marginLeft=((scale-1)*d.w/2)+'px';stage.style.marginRight=((scale-1)*d.w/2)+'px';
 stage.style.marginTop=((scale-1)*d.h/2)+'px';stage.style.marginBottom=((scale-1)*d.h/2)+'px';
}
function fold8OpenAfterPin(callback){
 const device=document.getElementById('fold-device');
 fold8Unlocked=true;
 if(device){device.classList.add('opening');device.classList.add('unfolded')}
 fold8Fit();
 window.setTimeout(()=>{if(device)device.classList.remove('opening');callback();fold8Fit()},1500);
}
window.addEventListener('resize',fold8Fit);
window.addEventListener('orientationchange',fold8Fit);
window.addEventListener('DOMContentLoaded',fold8Fit);

const KYU_UNFOLLOW_REPLIES=['?','뭐야?','대리님 나한테 화난 거 있어ㅓ…?','아님 노안이 벌써 왔나? 왜 인스타 팔로우를 끊어 ㅡㅡ','아 빨리 다시 팔로우 해애애애ㅐ'];
function kyuToggleInstagramFollow(){
 const wasFollowing=state.following;
 state.following=!state.following;
 render();
 if(wasFollowing){
  // First message at 7 seconds; subsequent messages every 2 seconds.
  KYU_UNFOLLOW_REPLIES.forEach((line,i)=>setTimeout(()=>{
   kyuPush('뀨 ❤️',line);
   if(state.page==='chat0'){
    render();
    const bg=document.querySelector('.chatbg');
    if(bg)bg.scrollTop=bg.scrollHeight;
   }
  },7000+2000*i));
 }
}
let kyuNoticeTimer=null;
let kakaoBannerTarget=0;
// All incoming KakaoTalk notifications share the same compact banner UI.
function showKakaoBanner(sender,text,roomIndex=0){
 if(state.page==='chat'+roomIndex)return;
 const layer=document.getElementById('kyu-notice-layer');if(!layer)return;
 kakaoBannerTarget=roomIndex;
 layer.innerHTML=`<button class="kyu-live-banner" onclick="openKakaoBanner()"><img class="kyu-live-banner-icon" src="images/174d6cb00fc122f9.png" alt="카카오톡"><span class="kyu-live-banner-copy"><strong>${esc(sender)}</strong><span>${esc(text)}</span></span></button>`;
 clearTimeout(kyuNoticeTimer);
 kyuNoticeTimer=setTimeout(()=>{layer.innerHTML=''},4000);
}
function kyuShowNotice(text){showKakaoBanner('뀨 ❤️',text,0)}
function openKakaoBanner(){
 const layer=document.getElementById('kyu-notice-layer');if(layer)layer.innerHTML='';
 clearTimeout(kyuNoticeTimer);
 if(state.page==='lock'||state.page==='pin'){state.lockTarget=kakaoBannerTarget;go('pin')}
 else{openChat(kakaoBannerTarget);const bg=document.querySelector('.chatbg');if(bg)bg.scrollTop=bg.scrollHeight}
}
function kyuOpenNotice(){openKakaoBanner()}
function kyuPush(sender,text){state.kyuAdded.push({sender,text,time:simTime()});rooms[0][1]=text;rooms[0][2]=simTime();if(sender==='뀨 ❤️')showKakaoBanner(sender,text,0)}
function kyuReadAll(){state.kyuReadThrough=state.kyuAdded.length-1;if(state.page==='chat0')render()}
function kyuRepliesInSequence(lines){lines.forEach((t,i)=>setTimeout(()=>{kyuPush('뀨 ❤️',t);if(state.page==='chat0'){render();const bg=document.querySelector('.chatbg');if(bg)bg.scrollTop=bg.scrollHeight}},1000*(i+1)))}
function sendKyuChat(){if(state.page!=='chat0')return;const el=document.getElementById('kt-compose');const t=el?.value.trim();if(!t)return;kyuPush('나',t);render();if(kyuIsBreakingUp(t)){kyuStartBreakup()}else if(kyuIsMissing(t)){state.kyuCall='ringing';setTimeout(()=>{if(state.kyuCall==='ringing'&&state.page==='chat0'){kyuReadAll();go('kyuIncoming')}},900)}else if(kyuIsLove(t)){setTimeout(()=>{kyuReadAll();kyuRepliesInSequence(KYU_LOVE_REPLIES)},900)}else if(kyuIsPouting(t)){setTimeout(()=>{kyuReadAll();kyuRepliesInSequence(KYU_POUT_REPLIES)},900)}}
function kyuStartBreakup(){
 const token=++state.kyuBreakupToken;
 state.kyuBreakupStage=1;
 // One second after the message is sent, Kyu reads it and calls.
 setTimeout(()=>{
  if(token!==state.kyuBreakupToken)return;
  kyuReadAll();
  kyuBreakupFlashCall(token,()=>{
   kyuBreakupMessages(KYU_BREAKUP_FIRST,token,()=>{
    if(token!==state.kyuBreakupToken)return;
    state.kyuBreakupStage=2;
    kyuBreakupFlashCall(token,()=>{
     kyuBreakupMessages(KYU_BREAKUP_LAST,token,()=>{
      if(token===state.kyuBreakupToken)state.kyuBreakupStage=0;
     });
    });
   });
  });
 },1000);
}
function kyuBreakupFlashCall(token,done){
 if(token!==state.kyuBreakupToken)return;
 state.kyuCall='breakup-ringing';
 go('kyuIncoming');
 setTimeout(()=>{
  if(token!==state.kyuBreakupToken||state.kyuCall!=='breakup-ringing')return;
  state.kyuCall=null;
  go('chat0');
  // Messages start two seconds after the call disconnects.
  setTimeout(()=>{if(token===state.kyuBreakupToken)done()},2000);
 },2000);
}
function kyuBreakupMessages(lines,token,done){
 lines.forEach((line,i)=>setTimeout(()=>{
  if(token!==state.kyuBreakupToken)return;
  kyuPush('뀨 ❤️',line);
  if(state.page==='chat0')render();
  if(i===lines.length-1)setTimeout(()=>{if(token===state.kyuBreakupToken)done()},600);
 },i*1000));
}
function rejectKyuCall(){if(state.kyuCall==='breakup-ringing')return;if(state.kyuCall!=='ringing')return;state.kyuCall=null;go('chat0');kyuRepliesInSequence(KYU_MISS_REPLIES)}
function answerKyuCall(){if(state.kyuCall==='breakup-ringing')return;if(state.kyuCall!=='ringing')return;state.kyuCall='speaking';state.kyuCallStep=0;state.kyuCallStarted=Date.now();go('kyuSpeaking');kyuNextLine()}
function kyuNextLine(){const outgoing=state.kyuOutgoing;const token=state.kyuOutgoingToken;setTimeout(()=>{if(state.kyuCall!=='speaking'||state.page!=='kyuSpeaking'||state.kyuOutgoing!==outgoing||(outgoing&&token!==state.kyuOutgoingToken))return;state.kyuCallStep++;if(state.kyuCallStep>=(outgoing?KYU_OUTGOING_LINES.length:5)){endKyuCall();return}render();kyuNextLine()},3000)}
function endKyuCall(){const outgoing=state.kyuOutgoing;state.kyuCall=null;state.kyuOutgoing=false;if(outgoing){state.kyuOutgoingToken++;go('phone')}else go('chat0')}
setInterval(()=>{if(state.page==='kyuSpeaking'&&state.kyuCall==='speaking'){const e=document.getElementById('kyu-call-clock');if(e){const sec=Math.floor((Date.now()-state.kyuCallStarted)/1000);e.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}}},250);
function openChat(i){state.unread[i]=0;go('chat'+i)}function view(f){state.viewer=f;render()}function closeViewer(){state.viewer=null;document.getElementById('viewer')?.remove()}const KYU_OUTGOING_LINES=['여보세요~','무슨 일로 전화했어어어','별로 할 말 없었는데 그냥 전화했네…ㅎ','아니이?? 나도 보구 싶었지','안 보고 싶었을 리가….ㅎㅎ 바보 뚱처리','어? 아 형 나 지금 일이 생겨서','이따가 전화할게 사랑해'];
function call(name){if(!name)return;state.callName=name;
 if(name==='뀨 ❤️'){
  const token=++state.kyuOutgoingToken;
  state.kyuOutgoing=true;state.kyuCall='outgoing-ringing';go('calling');
  setTimeout(()=>{if(token!==state.kyuOutgoingToken||state.kyuCall!=='outgoing-ringing'||state.page!=='calling')return;
   state.kyuCall='speaking';state.kyuCallStep=0;state.kyuCallStarted=Date.now();go('kyuSpeaking');kyuNextLine();
  },3000);return;
 }
 go('calling');setTimeout(()=>{if(state.page==='calling')finishCall()},5000)}function finishCall(){if(state.kyuCall==='outgoing-ringing'){state.kyuOutgoingToken++;state.kyuCall=null;state.kyuOutgoing=false;go('phone');return}state.failed.unshift(['10/24 11:58',state.callName,'발신 실패','']);go('phone');alert('연결할 수 없습니다')}render();fold8Fit();
</script></body></html>
